name: Secret Scanning

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full-history audit. gitleaks-action only omits --log-opts for
    # schedule/workflow_dispatch, so this is the trigger that scans every
    # commit rather than just the ones in a push or PR range.
    - cron: '17 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: checkout needs contents:read, the action needs
# pull-requests:write to post inline review comments on findings.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    # This exact name is what branch protection must require.
    name: Gitleaks Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Required. gitleaks-action scans the range
          # <first pushed commit>^..<last pushed commit>, so the parent of the
          # first commit must exist locally. fetch-depth 0 guarantees that.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: latest
